name: Tray tooltip check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tray-tooltip:
    uses: CyberGems/.github/.github/workflows/tray-tooltip-check.yml@main

  tray-tooltip-tests:
    name: Tray tooltip tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # generate_context! reads frontendDist, so the web build has to exist first.
      - run: npm run build
      - working-directory: src-tauri
        run: cargo test tray_tooltip
