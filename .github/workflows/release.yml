name: "Release"
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: install dependencies
        run: npm install

      - name: Validate updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured in GitHub repository secrets."
          }
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured in GitHub repository secrets."
          }
          if (Test-Path pnpm-lock.yaml) { Remove-Item pnpm-lock.yaml }

      - name: Extract Release Notes
        id: extract_notes
        shell: pwsh
        run: |
          node scripts/extract-release-notes.js "${{ github.ref_name }}"
          $notes = Get-Content RELEASE_NOTES.txt -Raw
          $eof = [Guid]::NewGuid().ToString()
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes<<$eof"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $notes
          Add-Content -Path $env:GITHUB_OUTPUT -Value $eof

      - uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CyberPaste ${{ github.ref_name }}"
          releaseBody: ${{ steps.extract_notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.settings.args }}

      - name: Scan Built Installers with VirusTotal & Update Release Body
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          $bundles = Get-ChildItem -Path "src-tauri/target" -Recurse -Include "*.exe", "*.msi" | Where-Object { $_.FullName -like "*\bundle\*" }
          $installer = $bundles | Where-Object { $_.Extension -eq ".exe" } | Select-Object -First 1
          $msi = $bundles | Where-Object { $_.Extension -eq ".msi" } | Select-Object -First 1

          $installerHash = if ($installer) { (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower() } else { "pending" }
          $msiHash = if ($msi) { (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower() } else { "pending" }

          Write-Host "Setup Installer: $($installer.FullName) [SHA256: $installerHash]"
          Write-Host "MSI Package: $($msi.FullName) [SHA256: $msiHash]"

          if ($env:VIRUSTOTAL_API_KEY) {
            function Upload-VirusTotal($filePath, $apiKey) {
              $item = Get-Item $filePath
              $sizeMb = [Math]::Round($item.Length / 1MB, 2)
              Write-Host "Uploading $filePath ($sizeMb MB) to VirusTotal..."
              $headers = @{ "x-apikey" = $apiKey }
              $url = "https://www.virustotal.com/api/v3/files"

              if ($item.Length -gt 30MB) {
                Write-Host "File exceeds 30MB ($sizeMb MB), requesting dedicated large-file upload endpoint from VirusTotal..."
                $urlResp = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Method Get -Headers $headers -TimeoutSec 60
                $url = $urlResp.data
                Write-Host "Using dedicated endpoint: $url"
              }

              $resp = & curl.exe -s -S --fail -X POST -H "x-apikey: $apiKey" -F "file=@$filePath" "$url"
              Write-Host "Upload successful. Response: $resp"
            }

            if ($installer) {
              try { Upload-VirusTotal $installer.FullName $env:VIRUSTOTAL_API_KEY } catch { Write-Warning "VirusTotal installer upload warning: $_" }
            }
            if ($msi) {
              try { Upload-VirusTotal $msi.FullName $env:VIRUSTOTAL_API_KEY } catch { Write-Warning "VirusTotal MSI upload warning: $_" }
            }
          } else {
            Write-Host "VIRUSTOTAL_API_KEY secret not found; skipping direct upload and using computed SHA256 hashes."
          }

          if (Test-Path ".github/release-template.md") {
            $template = [System.IO.File]::ReadAllText(".github/release-template.md", [System.Text.Encoding]::UTF8)
            $notes = $template.Replace("{{VERSION}}", "${{ github.ref_name }}").Replace("{{INSTALLER_HASH}}", $installerHash).Replace("{{MSI_HASH}}", $msiHash)
            [System.IO.File]::WriteAllText("FINAL_RELEASE_NOTES.md", $notes, [System.Text.Encoding]::UTF8)

            try {
              gh release edit "${{ github.ref_name }}" --notes-file "FINAL_RELEASE_NOTES.md"
              Write-Host "Successfully updated release body with VirusTotal inspection hashes!"
            } catch {
              Write-Warning "Could not update release body via gh cli: $_"
            }
          }
