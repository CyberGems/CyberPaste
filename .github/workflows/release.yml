name: "Release"
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh About icons from official app repositories
        uses: CyberGems/CyberSnap/.github/actions/sync-suite-icons@80266c5b4ad7fa4c5768e2543a4c7c7a461fc8f7
        with:
          config: .github/about-icons.json

      - name: Validate release summary
        run: node .github/scripts/validate-release-summary.mjs

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: install dependencies
        run: npm install

      - name: Validate updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured in GitHub repository secrets."
          }
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured in GitHub repository secrets."
          }
          if (Test-Path pnpm-lock.yaml) { Remove-Item pnpm-lock.yaml }

      - name: Extract Release Notes
        id: extract_notes
        shell: pwsh
        run: |
          node scripts/extract-release-notes.js "${{ github.ref_name }}"
          $notes = Get-Content RELEASE_NOTES.txt -Raw
          $eof = [Guid]::NewGuid().ToString()
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes<<$eof"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $notes
          Add-Content -Path $env:GITHUB_OUTPUT -Value $eof

      - name: Pre-seed NSIS toolset (bypass flaky binary-releases asset)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tools = Join-Path $env:LOCALAPPDATA "tauri"
          $nsis = Join-Path $tools "NSIS"
          if (Test-Path $nsis) { Write-Host "NSIS toolset already present"; exit 0 }
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          # Fetch the exact NSIS zip tauri-bundler expects through the
          # release-assets API route: the /releases/download route has
          # been returning HTTP 504 for this asset.
          #
          # MAINTENANCE: the SHA1 below and the plugin DLL version are pinned
          # to the tauri-bundler constants of @tauri-apps/cli 2.11.1
          # (NSIS_SHA1 / NSIS_TAURI_UTILS_URL in crates/tauri-bundler). Update
          # both when the CLI is upgraded, or remove this step entirely once
          # GitHub's /releases/download route serves this asset reliably.
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/tauri-apps/binary-releases/releases/tags/nsis-3.11" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $zip = Join-Path $env:RUNNER_TEMP "nsis-3.11.zip"
          Invoke-WebRequest -Uri $release.assets[0].url -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/octet-stream" } -OutFile $zip
          $sha1 = (Get-FileHash -Algorithm SHA1 $zip).Hash
          if ($sha1 -ne "EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D") { throw "NSIS zip SHA1 mismatch: $sha1" }

          Expand-Archive -Path $zip -DestinationPath $tools
          Move-Item (Join-Path $tools "nsis-3.11") $nsis

          # Required plugin DLL pinned by tauri-bundler (@tauri-apps/cli 2.11.1).
          $pluginDir = Join-Path $nsis "Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll" -OutFile (Join-Path $pluginDir "nsis_tauri_utils.dll")
          Write-Host "NSIS toolset seeded at $nsis"

      - uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CyberPaste ${{ github.ref_name }}"
          releaseBody: ${{ steps.extract_notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.settings.args }}

      - name: Publish checksums in release notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $versionNum = $tag.TrimStart("v")

          $installer = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*-setup.exe" |
            Where-Object { $_.FullName -match '\\bundle\\nsis\\' } |
            Select-Object -First 1
          $msi = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.msi" |
            Where-Object { $_.FullName -match '\\bundle\\msi\\' -and $_.Name -notlike "*.zip*" } |
            Select-Object -First 1

          $installerHash = if ($installer) { (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower() } else { "pending" }
          $msiHash = if ($msi) { (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower() } else { $null }

          Write-Host "Setup Installer: $($installer.FullName) [SHA256: $installerHash]"
          if ($msi) {
            Write-Host "MSI Package: $($msi.FullName) [SHA256: $msiHash]"
          } else {
            Write-Host "MSI Package: not built (bundle targets do not include msi)"
          }

          if (Test-Path ".github/release-template.md") {
            $msiBlock = ""
            if ($msiHash) {
              $msiBlock = "`r`n- **CyberPaste_${versionNum}_x64_en-US.msi** — SHA256:`r`n  ``````text`r`n  $msiHash`r`n  ```````r`n"
            }

            $template = [System.IO.File]::ReadAllText(".github/release-template.md", [System.Text.Encoding]::UTF8)
            $notes = $template.
              Replace("{{VERSION_NUM}}", $versionNum).
              Replace("{{VERSION}}", $tag).
              Replace("{{INSTALLER_HASH}}", $installerHash).
              Replace("{{PORTABLE_HASH}}", "pending").
              Replace("{{MSI_BLOCK}}", $msiBlock)
            [System.IO.File]::WriteAllText("FINAL_RELEASE_NOTES.md", $notes, [System.Text.Encoding]::UTF8)

            try {
              gh release edit $tag --notes-file "FINAL_RELEASE_NOTES.md"
              Write-Host "Successfully updated release body with installer checksums."
            } catch {
              Write-Warning "Could not update release body via gh cli: $_"
            }
          }

      - name: Build and publish portable package
        shell: pwsh
        env:
          VITE_CYBERPASTE_PORTABLE: "true"
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $versionNum = $tag.TrimStart("v")
          $portableRoot = Join-Path $env:RUNNER_TEMP "CyberPaste-portable"
          $portableZip = Join-Path $env:RUNNER_TEMP "CyberPaste_${versionNum}_x64-portable.zip"

          if (Test-Path $portableRoot) { Remove-Item -LiteralPath $portableRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $portableRoot | Out-Null

          npm run build
          cargo build --manifest-path src-tauri/Cargo.toml --release --features portable

          Copy-Item -LiteralPath "src-tauri/target/release/CyberPaste.exe" -Destination (Join-Path $portableRoot "CyberPaste.exe")
          Copy-Item -LiteralPath "LICENSE" -Destination (Join-Path $portableRoot "LICENSE")
          Copy-Item -LiteralPath "docs/PORTABLE.md" -Destination (Join-Path $portableRoot "PORTABLE.md")
          Compress-Archive -Path (Join-Path $portableRoot "*") -DestinationPath $portableZip -CompressionLevel Optimal

          $portableHash = (Get-FileHash $portableZip -Algorithm SHA256).Hash.ToLower()
          Write-Host "Portable package: $portableZip [SHA256: $portableHash]"
          gh release upload $tag $portableZip --clobber

          $installer = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*-setup.exe" |
            Where-Object { $_.FullName -match '\\bundle\\nsis\\' } |
            Select-Object -First 1
          $msi = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.msi" |
            Where-Object { $_.FullName -match '\\bundle\\msi\\' -and $_.Name -notlike "*.zip*" } |
            Select-Object -First 1
          $installerHash = if ($installer) { (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower() } else { "pending" }
          $msiHash = if ($msi) { (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower() } else { $null }
          $msiBlock = ""
          if ($msiHash) {
            $msiBlock = "`r`n- **CyberPaste_${versionNum}_x64_en-US.msi** — SHA256:`r`n  ``````text`r`n  $msiHash`r`n  ```````r`n"
          }
          $template = [System.IO.File]::ReadAllText(".github/release-template.md", [System.Text.Encoding]::UTF8)
          $notes = $template.
            Replace("{{VERSION_NUM}}", $versionNum).
            Replace("{{VERSION}}", $tag).
            Replace("{{INSTALLER_HASH}}", $installerHash).
            Replace("{{PORTABLE_HASH}}", $portableHash).
            Replace("{{MSI_BLOCK}}", $msiBlock)
          [System.IO.File]::WriteAllText("FINAL_RELEASE_NOTES.md", $notes, [System.Text.Encoding]::UTF8)
          gh release edit $tag --notes-file "FINAL_RELEASE_NOTES.md"

          # Update latest.json updater manifest with bilingual release notes
          try {
            gh release download $tag --pattern "latest.json" --clobber
            if (Test-Path "latest.json") {
              $lj = Get-Content "latest.json" -Raw | ConvertFrom-Json
              $lj.notes = $notes
              $lj | ConvertTo-Json -Depth 10 | Set-Content "latest.json" -Encoding UTF8
              gh release upload $tag "latest.json" --clobber
              Write-Host "Successfully updated latest.json with bilingual release notes."
            }
          } catch {
            Write-Warning "Could not update latest.json with bilingual notes: $_"
          }
