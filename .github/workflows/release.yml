name: "Release"
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: install dependencies
        run: npm install

      - name: Validate updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured in GitHub repository secrets."
          }
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured in GitHub repository secrets."
          }
          if (Test-Path pnpm-lock.yaml) { Remove-Item pnpm-lock.yaml }

      - name: Extract Release Notes
        id: extract_notes
        shell: pwsh
        run: |
          node scripts/extract-release-notes.js "${{ github.ref_name }}"
          $notes = Get-Content RELEASE_NOTES.txt -Raw
          $eof = [Guid]::NewGuid().ToString()
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes<<$eof"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $notes
          Add-Content -Path $env:GITHUB_OUTPUT -Value $eof

      - uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CyberPaste ${{ github.ref_name }}"
          releaseBody: ${{ steps.extract_notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.settings.args }}

      - name: Publish checksums in release notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $versionNum = $tag.TrimStart("v")

          $installer = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*-setup.exe" |
            Where-Object { $_.FullName -match '\\bundle\\nsis\\' } |
            Select-Object -First 1
          $msi = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.msi" |
            Where-Object { $_.FullName -match '\\bundle\\msi\\' -and $_.Name -notlike "*.zip*" } |
            Select-Object -First 1

          $installerHash = if ($installer) { (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower() } else { "pending" }
          $msiHash = if ($msi) { (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower() } else { $null }

          Write-Host "Setup Installer: $($installer.FullName) [SHA256: $installerHash]"
          if ($msi) {
            Write-Host "MSI Package: $($msi.FullName) [SHA256: $msiHash]"
          } else {
            Write-Host "MSI Package: not built (bundle targets do not include msi)"
          }

          if (Test-Path ".github/release-template.md") {
            $msiBlock = ""
            if ($msiHash) {
              $msiBlock = "- **CyberPaste_${versionNum}_x64_en-US.msi** — SHA256: ``$msiHash```r`n"
            }

            $template = [System.IO.File]::ReadAllText(".github/release-template.md", [System.Text.Encoding]::UTF8)
            $notes = $template.
              Replace("{{VERSION_NUM}}", $versionNum).
              Replace("{{VERSION}}", $tag).
              Replace("{{INSTALLER_HASH}}", $installerHash).
              Replace("{{MSI_BLOCK}}", $msiBlock)
            [System.IO.File]::WriteAllText("FINAL_RELEASE_NOTES.md", $notes, [System.Text.Encoding]::UTF8)

            try {
              gh release edit $tag --notes-file "FINAL_RELEASE_NOTES.md"
              Write-Host "Successfully updated release body with installer checksums."
            } catch {
              Write-Warning "Could not update release body via gh cli: $_"
            }
          }

