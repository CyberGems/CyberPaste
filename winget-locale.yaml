ShortDescription: Local clipboard history with search, OCR and pinning for Windows
Description: Copy something, copy three more things, and the first one is already gone. CyberPaste keeps a searchable history of everything you copy, including text, code, images, links and files, with rich HTML and RTF content preserved natively, in a local SQLite database, with folders, favorites, pinning and editing. One global hotkey pastes straight into the app you were using; instant search and local OCR find a clip from weeks ago or the words inside an image, and an optional AI provider can summarize or transform a clip once you connect one. Configurable retention, a PIN or password lock, quiet hours, a tray pause with flexible durations and automatic backups round it out, with no account and no telemetry. Built with Tauri.
